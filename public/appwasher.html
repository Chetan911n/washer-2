<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AppWasher</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f5;--cd:#fff;--tx:#101614;--mu:#6a7570;--ln:#e5e8e6;--g:#117a58;--gd:#0d5f45;--g2:#e5f3ed;--am:#a8680f;--am2:#fcf1db;--bl:#2457c5;--bl2:#e7eefb;--rd:#b83a2e;--sh:0 1px 2px rgba(16,22,20,.04),0 10px 30px rgba(16,22,20,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1210;--cd:#161d1a;--tx:#eef2f0;--mu:#92a09a;--ln:#26302c;--g:#3dbb8f;--gd:#2fa27a;--g2:#173328;--am2:#33280f;--bl2:#15233f;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1210;--cd:#161d1a;--tx:#eef2f0;--mu:#92a09a;--ln:#26302c;--g:#3dbb8f;--gd:#2fa27a;--g2:#173328;--am2:#33280f;--bl2:#15233f;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;letter-spacing:-.02em}.logo svg{width:24px;height:24px;color:var(--g)}
.r{display:flex;align-items:center;gap:10px}.av{width:30px;height:30px;border-radius:50%;background:var(--g2);color:var(--g);display:grid;place-items:center;font-weight:600;font-size:12px}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}.wrap.ph{max-width:440px}
h1{font-size:28px;letter-spacing:-.03em;margin:0 0 4px;line-height:1.15}h2{font-size:16px;letter-spacing:-.01em;margin:0 0 12px}.mu{color:var(--mu)}.sm{font-size:12px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1.3fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.g2,.g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}@media(max-width:520px){.g4,.g3{grid-template-columns:1fr}.wrap{padding:16px 14px 50px}h1{font-size:24px}}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer;background:var(--g);color:#fff;transition:.15s}.btn:hover{background:var(--gd)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn.o:hover{background:var(--g2)}.btn.w{width:100%;padding:14px}.btn.s{padding:7px 14px;font-size:13px}.btn.k{background:var(--tx);color:var(--bg)}
.bd{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--g2);color:var(--g)}.bd.a{background:var(--am2);color:var(--am)}.bd.b{background:var(--bl2);color:var(--bl)}
input,select{width:100%;padding:11px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);outline:0}input:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--g2)}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 6px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:999px;border:1px solid var(--ln)}.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--mu)}.tabs .on{background:var(--cd);color:var(--tx);box-shadow:var(--sh)}
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.hero{background:linear-gradient(160deg,#0d3b2e,#117a58);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}.hero h1{font-size:40px}.hero li{margin:10px 0;list-style:none;opacity:.9}.form{display:grid;place-items:center;padding:24px}.form .cd{width:100%;max-width:400px}
@media(max-width:760px){.auth{grid-template-columns:1fr}.hero{padding:28px}.hero h1{font-size:28px}.hero ul{display:none}}
.trk{display:flex;margin:18px 0 6px}.trk div{flex:1;text-align:center;font-size:12px;color:var(--mu);position:relative}.trk i{display:block;width:22px;height:22px;border-radius:50%;border:2px solid var(--ln);margin:0 auto 6px;background:var(--cd);position:relative;z-index:1}
.trk .d i{background:var(--g);border-color:var(--g)}.trk .c i{border-color:var(--g)}.trk div:not(:first-child):before{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--ln)}.trk .d:before,.trk .c:before{background:var(--g)!important}
.promo{background:linear-gradient(135deg,#0d3b2e,#117a58);color:#fff;border:0}.promo .btn{background:#fff;color:#0d3b2e}
.sel{border:1.5px solid var(--ln);border-radius:16px;padding:14px;cursor:pointer;transition:.15s;background:var(--cd);display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px}.sel:hover{border-color:var(--g)}.sel.on{border-color:var(--g);background:var(--g2)}
.ci{width:44px;height:44px;border-radius:12px;background:var(--g2);color:var(--g);display:grid;place-items:center;flex:none}.ci svg{width:24px;height:24px}
.m{position:fixed;inset:0;background:rgba(10,16,13,.5);display:grid;place-items:end center;z-index:20;padding:0}.m>.cd{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0}
@media(min-width:600px){.m{place-items:center;padding:20px}.m>.cd{border-radius:24px}}
.stp{display:flex;gap:6px;margin-bottom:16px}.stp i{flex:1;height:4px;border-radius:4px;background:var(--ln)}.stp .on{background:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border:1px solid var(--ln);border-radius:999px;cursor:pointer;background:var(--cd);font-weight:500;font-size:13px}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}.chip.x{opacity:.4;pointer-events:none}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mu);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--ln)}td{padding:12px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}.ov{overflow-x:auto}
.mt{font-size:26px;font-weight:700;letter-spacing:-.03em}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pb{aspect-ratio:4/3;border:1.5px dashed var(--ln);border-radius:16px;display:grid;place-items:center;cursor:pointer;font-size:12px;color:var(--mu);background:var(--bg)}.pb.on{border:1.5px solid var(--g);background:var(--g2);color:var(--g);font-weight:600}
.star{font-size:34px;cursor:pointer;color:var(--ln);background:none;border:0;padding:2px}.star.on{color:#e0a21a}
.em{text-align:center;padding:28px 10px;color:var(--mu)}
</style></head><body><div id="app"></div><div id="m"></div>
<script>
const K="appwasher_v2",PK=[{id:"ext",n:"Exterior Foam Wash",p:499,d:"Foam wash, wheel clean, glass shine"},{id:"deep",n:"Deep Wash & Polish",p:799,d:"Foam wash, tyre dressing, wax polish"},{id:"prem",n:"Premium Detail",p:1199,d:"Deep wash plus interior vacuum and dashboard care"}];
const WS=["Rajesh Kumar","Suresh Verma","Imran Khan"],SL=["06:30 AM","08:30 AM","03:00 PM","05:00 PM"],CR={customer:["chetan","demo123"],station:["station","station123"],washer:["rajesh","washer123"]},RN={customer:"Customer",station:"Station Head",washer:"Field Washer"};
const seed={role:null,cars:[{id:1,name:"Hyundai Creta",type:"SUV",plate:"MH12AB1234"},{id:2,name:"Maruti Swift",type:"Hatchback",plate:"MH12CD5678"}],addr:"Skyline Society, Hinjewadi Phase 1, Pune",spot:"Basement 2, Pillar 45",bk:[],n:1,settled:0,name:"Chetan"};
let S;try{S=JSON.parse(localStorage.getItem(K))||seed}catch(e){S=seed}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const R=n=>"₹"+n.toLocaleString("en-IN"),$=s=>document.querySelector(s),car='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17v2m14-2v2M3 13l2-6a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 6v4H3zM7 14h.01M17 14h.01"/></svg>',drop='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c3.6 4.2 6 7.2 6 10.4a6 6 0 0 1-12 0c0-3.200 2.400-6.200 6-10.400z"/></svg>';
let M=null,AU={role:"customer",reg:false},WT="today";
const A={
 role(r){AU.role=r;draw()},reg(v){AU.reg=v;draw()},
 login(demo){const r=AU.role,c=CR[r];let u=$("#u")?.value.trim().toLowerCase(),p=$("#p")?.value;if(demo){u=c[0];p=c[1]}
  if(AU.reg&&r==="customer"&&!demo){if(!u||!p)return A.err("Enter a username and password");const cn=$("#cn").value.trim();if(cn)S.cars.push({id:Date.now(),name:cn,type:$("#ct").value,plate:$("#pl").value||"-"});S.spot=$("#sp").value||S.spot;S.name=u[0].toUpperCase()+u.slice(1)}
  else if(u!==c[0]||p!==c[1])return A.err("Incorrect credentials. Use the demo button.");
  S.role=r;save();draw()},
 err(t){$("#er").textContent=t},out(){S.role=null;save();draw()},
 addCar(){const n=$("#nc").value.trim();if(!n)return;S.cars.push({id:Date.now(),name:n,type:$("#nt").value,plate:$("#np").value||"-"});save();draw()},
 delCar(i){S.cars=S.cars.filter(c=>c.id!==i);save();draw()},
 book(){const d=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()+i+1);return x.toDateString().slice(0,10)});M={s:1,cars:[],pkg:"ext",d:d[0],ds:d,sl:SL[1],addr:S.addr,spot:S.spot};mod()},
 tc(i){const a=M.cars,x=a.indexOf(i);x<0?a.push(i):a.splice(x,1);mod()},
 set(k,v){M[k]=v;mod()},go(n){M.s+=n;mod()},
 total(){return M.cars.length*PK.find(p=>p.id===M.pkg).p},
 confirm(){const t=A.total();S.bk.push({id:"AW"+(5245+S.n++),cars:M.cars.map(i=>S.cars.find(c=>c.id===i)),pkg:M.pkg,d:M.d,sl:M.sl,addr:M.addr,spot:M.spot,total:t,st:"Pending",w:null,bf:[0,0,0,0,0],af:[0,0,0,0],pay:null,rv:null});S.addr=M.addr;S.spot=M.spot;save();M=null;mod();draw()},
 close(){M=null;mod()},
 assign(id,w){if(!w)return;const b=S.bk.find(x=>x.id===id);b.w=w;b.st="Assigned";save();draw()},
 ph(id,k,i){const b=S.bk.find(x=>x.id===id);b[k][i]=b[k][i]?0:1;save();draw()},
 st(id,s){S.bk.find(x=>x.id===id).st=s;save();draw()},
 cash(id){const b=S.bk.find(x=>x.id===id);b.st="Paid";b.pay="Cash";save();draw()},
 upi(id){M={pay:id};mod()},
 paid(id){const b=S.bk.find(x=>x.id===id);b.st="Paid";b.pay="UPI";save();M=null;mod();draw()},
 rv(id){M={rv:id,r:5,tags:[],tip:0};mod()},tag(t){const a=M.tags,x=a.indexOf(t);x<0?a.push(t):a.splice(x,1);mod()},
 sub(){const b=S.bk.find(x=>x.id===M.rv);b.rv={r:M.r,tags:M.tags,tip:M.tip};save();M={done:1};mod();draw()},
 settle(){S.settled=fee();save();draw()},wt(t){WT=t;draw()}
};
const paidB=()=>S.bk.filter(b=>b.st==="Paid"),fee=()=>Math.round(paidB().reduce((a,b)=>a+b.total,0)*.2);
const dn={Pending:0,Assigned:1,Washing:2,"Awaiting Payment":3,Paid:4};
const bd=s=>`<span class="bd ${s==="Pending"?"a":s==="Paid"?"":"b"}">${s}</span>`;
const nm=b=>b.cars.map(c=>c.name).join(" + ");
function nav(){return`<header class="nav"><div class="logo">${drop}<b>AppWasher</b></div><div class="r"><span class="bd">${RN[S.role]}</span><span class="av">${S.role==="customer"?S.name[0]:S.role==="station"?"V":"R"}</span><button class="btn o s" onclick="A.out()">Log out</button></div></header>`}
function auth(){const r=AU.role,c=CR[r],reg=AU.reg&&r==="customer";
return`<div class="auth"><div class="hero"><div class="logo" style="font-size:20px">${drop}<b>AppWasher</b></div><div><h1>Clean cars.<br>Happy journeys.</h1><p style="opacity:.85;max-width:340px">Professional doorstep car wash, with photo proof at every step.</p><ul style="padding:0"><li>✓ Trained, verified technicians</li><li>✓ Before and after photo inspection</li><li>✓ Pay by UPI or cash after the wash</li></ul></div><span class="sm" style="opacity:.6">Customer · Station Head · Field Washer</span></div>
<div class="form"><div class="cd"><h1 style="font-size:24px">Welcome back</h1><p class="mu">Choose your portal to continue</p>
<div class="tabs">${Object.keys(RN).map(k=>`<button class="${k===r?"on":""}" onclick="A.role('${k}')">${RN[k]}</button>`).join("")}</div>
${r==="customer"?`<div class="tabs" style="margin-top:12px"><button class="${!reg?"on":""}" onclick="A.reg(false)">Sign in</button><button class="${reg?"on":""}" onclick="A.reg(true)">Register</button></div>`:""}
<label>Username</label><input id="u" value="${reg?"":c[0]}"><label>Password</label><input id="p" type="password" value="${reg?"":c[1]}">
${reg?`<label>Your car</label><input id="cn" placeholder="e.g. Honda City"><label>Car type</label><select id="ct"><option>Hatchback</option><option>Sedan</option><option>SUV</option></select><label>Plate number</label><input id="pl" placeholder="MH12XY0000"><label>Parking spot</label><input id="sp" placeholder="Basement 2, Pillar 45">`:""}
<div id="er" class="sm" style="color:var(--rd);min-height:18px;margin-top:8px"></div>
<button class="btn w" onclick="A.login(false)">${reg?"Create account":"Sign in"}</button><button class="btn o w" style="margin-top:8px" onclick="A.login(true)">Quick demo (${c[0]})</button></div></div></div>`}
function tracker(b){const d=dn[b.st];return`<div class="trk">${["Dispatched","Inspection","Washing","Payment"].map((t,i)=>`<div class="${i<d?"d":i===d?"c":""}"><i></i>${t}</div>`).join("")}</div>`}
function cust(){const act=[...S.bk].reverse().find(b=>b.st!=="Paid");
return`<div class="wrap"><h1>Hello, ${S.name}</h1><p class="mu">${S.addr}</p>
<div class="grid g2" style="margin:20px 0"><div class="cd promo"><h2 style="font-size:22px;margin-bottom:6px">Zero damage guarantee</h2><p style="opacity:.85;margin:0 0 16px">Photo inspection before and after every wash.</p><button class="btn" onclick="A.book()">Book a car wash</button></div>
<div class="cd"><h2>Active booking</h2>${act?`<div class="row"><b>${nm(act)}</b>${bd(act.st)}</div><div class="mu sm">#${act.id} · ${act.d}, ${act.sl}${act.w?" · "+act.w:""}</div>${tracker(act)}${act.st==="Awaiting Payment"?`<button class="btn w" style="margin-top:12px" onclick="A.upi('${act.id}')">Pay ${R(act.total)} via UPI</button>`:""}`:`<div class="em">No active wash. Book one in under a minute.</div>`}</div></div>
<div class="row"><h2>My garage</h2></div><div class="grid g3">${S.cars.map(c=>`<div class="cd row"><div class="row" style="gap:12px"><div class="ci">${car}</div><div><b>${c.name}</b><div class="mu sm">${c.type} · ${c.plate}</div></div></div><button class="btn o s" onclick="A.delCar(${c.id})">Remove</button></div>`).join("")}
<div class="cd"><input id="nc" placeholder="Car name, e.g. Honda City" style="margin-bottom:8px"><select id="nt" style="margin-bottom:8px"><option>Hatchback</option><option>Sedan</option><option>SUV</option></select><div class="row"><input id="np" placeholder="Plate"><button class="btn s" onclick="A.addCar()">Add</button></div></div></div>
<h2 style="margin-top:28px">Bookings</h2><div class="cd">${S.bk.length?[...S.bk].reverse().map(b=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap"><div><b>${nm(b)}</b><div class="mu sm">#${b.id} · ${b.d}, ${b.sl} · ${R(b.total)}${b.pay?" · "+b.pay:""}</div></div><div class="r">${bd(b.st)}${b.st==="Paid"&&!b.rv?`<button class="btn o s" onclick="A.rv('${b.id}')">Review</button>`:""}${b.rv?`<span class="mu sm">${"★".repeat(b.rv.r)}</span>`:""}</div></div>`).join(""):`<div class="em">Your bookings will appear here.</div>`}</div></div>`}
function stn(){const p=paidB(),tot=p.reduce((a,b)=>a+b.total,0),cash=p.filter(b=>b.pay==="Cash").reduce((a,b)=>a+b.total,0),f=fee(),pend=f-S.settled;
const mc=(t,v,s)=>`<div class="cd"><div class="mu sm">${t}</div><div class="mt">${v}</div><div class="sm mu">${s}</div></div>`;
return`<div class="wrap"><h1>Station hub</h1><p class="mu">Green Valley Station</p><div class="grid g4" style="margin:20px 0">${mc("Total bookings",S.bk.length,S.bk.filter(b=>b.st==="Pending").length+" awaiting dispatch")}${mc("Cash collected",R(cash),"to remit")}${mc("Station and crew",R(tot-f),"80% of paid jobs")}${mc("Platform fee",R(f),pend>0?R(pend)+" pending transfer":"settled")}</div>
<div class="cd"><div class="row"><h2>Dispatch queue</h2><button class="btn s" ${pend>0?"":"disabled"} onclick="A.settle()">Settle platform fee</button></div><div class="ov"><table><tr><th>Booking</th><th>Vehicles</th><th>Location</th><th>Status</th><th>Washer</th></tr>${S.bk.length?[...S.bk].reverse().map(b=>`<tr><td><b>${b.id}</b><div class="mu sm">${b.d}, ${b.sl}</div></td><td>${nm(b)}</td><td>${b.spot}</td><td>${bd(b.st)}</td><td>${b.w||`<select onchange="A.assign('${b.id}',this.value)" style="min-width:140px"><option value="">Assign…</option>${WS.map(w=>`<option>${w}</option>`).join("")}</select>`}</td></tr>`).join(""):`<tr><td colspan="5" class="em">No bookings yet. Book one from the Customer portal.</td></tr>`}</table></div></div>
<div class="cd" style="margin-top:16px"><h2>Completed-wash ledger</h2>${p.length?p.map(b=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--ln)"><span>${b.id} · ${nm(b)}</span><span>${R(b.total)} · ${b.pay}${b.rv?" · "+"★".repeat(b.rv.r):""}</span></div>`).join(""):`<div class="em">Completed jobs will be listed here.</div>`}</div></div>`}
function wsh(){const all=S.bk.filter(b=>b.w==="Rajesh Kumar"),list=all.filter(b=>WT==="today"?b.st!=="Paid":b.st==="Paid");
const grid=(b,k,l)=>`<div class="ph4">${l.map((t,i)=>`<div class="pb ${b[k][i]?"on":""}" onclick="A.ph('${b.id}','${k}',${i})">${b[k][i]?"✓ "+t:"📷 "+t}</div>`).join("")}</div>`;
return`<div class="wrap ph"><h1 style="font-size:24px">My jobs</h1><div class="tabs" style="margin:14px 0">${["today","done"].map(t=>`<button class="${WT===t?"on":""}" onclick="A.wt('${t}')">${t==="today"?"Today ("+all.filter(b=>b.st!=="Paid").length+")":"Completed ("+all.filter(b=>b.st==="Paid").length+")"}</button>`).join("")}</div>
${list.length?list.map(b=>{const bf=b.bf.slice(0,4).every(Boolean),af=b.af.every(Boolean);return`<div class="cd" style="margin-bottom:14px"><div class="row"><b>${nm(b)}</b>${bd(b.st)}</div><div class="mu sm">#${b.id} · ${b.sl} · ${PK.find(p=>p.id===b.pkg).n}</div><div style="margin:10px 0;padding:10px;background:var(--bg);border-radius:12px">📍 ${b.spot}<div class="mu sm">${b.addr}</div></div>
${b.st==="Assigned"?`<h2 class="sm">Before photos (required)</h2>${grid(b,"bf",["Front","Rear","Left side","Right side","Existing damage"])}<button class="btn w" style="margin-top:12px" ${bf?"":"disabled"} onclick="A.st('${b.id}','Washing')">Start wash</button>`:""}
${b.st==="Washing"?`<h2 class="sm">After photos</h2>${grid(b,"af",["Front","Rear","Left side","Right side"])}<button class="btn w" style="margin-top:12px" ${af?"":"disabled"} onclick="A.st('${b.id}','Awaiting Payment')">Complete job · ${R(b.total)}</button><button class="btn o w" style="margin-top:8px" onclick="A.st('${b.id}','Assigned')">Retake before photos</button>`:""}
${b.st==="Awaiting Payment"?`<h2 class="sm">Collect payment · ${R(b.total)}</h2><button class="btn w" onclick="A.cash('${b.id}')">Cash collected</button><p class="mu sm" style="text-align:center">Or the customer pays by UPI from their app.</p>`:""}
${b.st==="Paid"?`<div class="mu sm">Paid by ${b.pay}. Photos sent to the customer.</div>`:""}</div>`}).join(""):`<div class="cd em">${WT==="today"?"No jobs assigned yet. The Station Head assigns jobs from the dispatch queue.":"No completed jobs yet."}</div>`}</div>`}
function qr(){let s="";for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);if(f?!(x%6&&y%6&&x%6!==5&&y%6!==5||(x%6>1&&x%6<5&&y%6>1&&y%6<5)):((x*7+y*13+x*y)%5<2))s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return`<svg viewBox="0 0 21 21" width="150" fill="currentColor" style="display:block;margin:0 auto">${s}</svg>`}
function mod(){const e=$("#m");if(!M){e.innerHTML="";return}let h="";
if(M.pay){const b=S.bk.find(x=>x.id===M.pay);h=`<div class="row"><h2>Payment</h2><button class="btn o s" onclick="A.close()">Close</button></div><div style="text-align:center"><div class="mu sm">Amount due</div><div class="mt">${R(b.total)}</div><div style="margin:16px 0">${qr()}</div><p class="mu sm">Scan with any UPI app</p><div class="chips" style="justify-content:center;margin-bottom:16px"><span class="chip">GPay</span><span class="chip">PhonePe</span><span class="chip">Paytm</span></div><button class="btn w" onclick="A.paid('${b.id}')">Simulate instant payment</button></div>`}
else if(M.rv){h=`<div class="row"><h2>Rate your experience</h2><button class="btn o s" onclick="A.close()">Close</button></div><div style="text-align:center">${[1,2,3,4,5].map(i=>`<button class="star ${i<=M.r?"on":""}" onclick="M.r=${i};mod()">★</button>`).join("")}</div><label>What did you like?</label><div class="chips">${["Super clean","On time","Polite technician","Zero scratches"].map(t=>`<span class="chip ${M.tags.includes(t)?"on":""}" onclick="A.tag('${t}')">${t}</span>`).join("")}</div><label>Add a tip</label><div class="chips">${[0,30,50,100].map(t=>`<span class="chip ${M.tip===t?"on":""}" onclick="M.tip=${t};mod()">${t?R(t):"No tip"}</span>`).join("")}</div><button class="btn w" style="margin-top:20px" onclick="A.sub()">Submit review</button>`}
else if(M.done){h=`<div class="em"><div style="font-size:40px">✓</div><h2>Thank you</h2><p>Your review has been submitted.</p><button class="btn" onclick="A.close()">Done</button></div>`}
else{const p=PK.find(x=>x.id===M.pkg),T=["Cars","Package","Date and time","Location","Review"];
h=`<div class="stp">${T.map((_,i)=>`<i class="${i<M.s?"on":""}"></i>`).join("")}</div><div class="row"><h2>${T[M.s-1]}</h2><span class="mu sm">Step ${M.s} of 5</span></div>`;
if(M.s===1)h+=S.cars.map(c=>`<div class="sel ${M.cars.includes(c.id)?"on":""}" onclick="A.tc(${c.id})"><div class="row" style="gap:12px"><div class="ci">${car}</div><div><b>${c.name}</b><div class="mu sm">${c.type} · ${c.plate}</div></div></div><span>${M.cars.includes(c.id)?"✓":""}</span></div>`).join("")||`<div class="em">Add a car in My garage first.</div>`;
if(M.s===2)h+=PK.map(x=>`<div class="sel ${M.pkg===x.id?"on":""}" onclick="A.set('pkg','${x.id}')"><div><b>${x.n}</b><div class="mu sm">${x.d}</div></div><b>${R(x.p)}<span class="mu sm">/car</span></b></div>`).join("");
if(M.s===3)h+=`<label>Date</label><div class="chips">${M.ds.map(d=>`<span class="chip ${M.d===d?"on":""}" onclick="A.set('d','${d}')">${d}</span>`).join("")}</div><label>Time slot</label><div class="chips">${SL.map(t=>`<span class="chip ${M.sl===t?"on":""}" onclick="A.set('sl','${t}')">${t}</span>`).join("")}</div>`;
if(M.s===4)h+=`<label>Service address</label><input value="${M.addr}" oninput="M.addr=this.value"><label>Exact parking spot</label><input value="${M.spot}" oninput="M.spot=this.value">`;
if(M.s===5)h+=`<div class="cd" style="box-shadow:none"><div class="row"><span class="mu">${M.cars.length} car${M.cars.length>1?"s":""} · ${p.n}</span><span>${R(p.p)} × ${M.cars.length}</span></div><div class="mu sm" style="margin:6px 0">${M.d}, ${M.sl}<br>${M.spot}, ${M.addr}</div><hr style="border:0;border-top:1px solid var(--ln)"><div class="row"><b>Total amount</b><span class="mt">${R(A.total())}</span></div></div>`;
const ok=M.s===1?M.cars.length>0:M.s===4?M.addr&&M.spot:true;
h+=`<div class="row" style="margin-top:18px">${M.s>1?`<button class="btn o" onclick="A.go(-1)">Back</button>`:`<button class="btn o" onclick="A.close()">Cancel</button>`}${M.s<5?`<button class="btn" ${ok?"":"disabled"} onclick="A.go(1)">Next</button>`:`<button class="btn" onclick="A.confirm()">Confirm and book · ${R(A.total())}</button>`}</div>`}
e.innerHTML=`<div class="m" onclick="if(event.target===this)A.close()"><div class="cd">${h}</div></div>`}
function draw(){$("#app").innerHTML=!S.role?auth():nav()+(S.role==="customer"?cust():S.role==="station"?stn():wsh())}
addEventListener("storage",e=>{if(e.key===K){try{S=JSON.parse(e.newValue);draw()}catch(x){}}});
draw();
</script></body></html>
